<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>かんじとえ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#151515;background:#fff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-width:320px;min-height:100vh;min-height:100dvh;overflow:hidden;background:#fff}[hidden]{display:none!important}button,input{font:inherit}.screen{min-height:100vh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left))}
#home{display:grid;grid-template-rows:auto 1fr;gap:clamp(16px,3vh,30px)}#home h1{margin:0;text-align:center;font-size:clamp(34px,6vw,64px)}#sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px)}.set{border:4px solid #171717;border-radius:22px;background:#fff;padding:16px 12px;cursor:pointer;display:grid;align-content:center;gap:10px;color:#171717}.set:active,.choice:active{background:#f2f2f2;transform:scale(.98)}.set:focus-visible,.choice:focus-visible{outline:6px solid #1259b6;outline-offset:5px}.set-name{font-size:clamp(25px,3.3vw,42px);font-weight:800}.set-words{font-size:clamp(20px,2.7vw,34px);letter-spacing:.12em;line-height:1.4}
#student{display:none;grid-template-rows:minmax(150px,36vh) 1fr;gap:clamp(18px,4vh,42px)}#student.show{display:grid}.kanji{display:grid;place-items:center;border:4px solid #171717;border-radius:28px;font-size:clamp(76px,14vw,160px);font-weight:700;line-height:1}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,36px)}.choice{border:4px solid #171717;border-radius:24px;background:#fff;min-height:220px;display:grid;place-items:center;padding:14px;cursor:pointer}.picture{display:block;width:clamp(120px,17vw,210px);aspect-ratio:1;background-color:#fff;background-image:var(--sprite);background-repeat:no-repeat;background-size:500% 200%;background-position:var(--position-x) var(--position-y)}.number-picture{display:grid;place-items:center;width:clamp(120px,17vw,210px);aspect-ratio:1;font-size:clamp(72px,11vw,145px);font-weight:800;line-height:1;color:#151515}.reading{display:block;margin-top:.35em;color:#151515;font-size:clamp(28px,4vw,48px);font-weight:800;letter-spacing:0;line-height:1.2}.check.term{font-size:clamp(62px,10vw,130px)}#check-target{font-size:clamp(22px,3vw,38px);font-weight:700}
.symbol-picture{width:clamp(120px,17vw,210px);aspect-ratio:1;position:relative;display:grid;place-items:center;color:#151515}.clock-picture{border:9px solid #2e557f;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 7px #dceafa}.clock-picture::before{content:'12';position:absolute;top:7%;font-size:22%;font-weight:800}.clock-picture::after{content:'6';position:absolute;bottom:7%;font-size:22%;font-weight:800}.clock-side{position:absolute;font-size:22%;font-weight:800}.clock-side.left{left:8%;top:42%}.clock-side.right{right:8%;top:42%}.clock-hand{position:absolute;left:50%;bottom:50%;width:8%;border-radius:999px;background:#171717;transform-origin:50% 100%}.clock-hand.hour{height:30%;transform:translateX(-50%) rotate(var(--hour-angle))}.clock-hand.minute{height:39%;background:#cf2028;transform:translateX(-50%)}.clock-dot{position:absolute;left:44.5%;top:44.5%;width:11%;aspect-ratio:1;border-radius:50%;background:#171717}.calendar-picture{grid-template-columns:repeat(7,minmax(0,1fr));align-content:start;padding:19% 4% 8%;gap:1%;border:5px solid #242424;border-radius:12%;background:linear-gradient(#dc3941 0 24%,#fff 24%);font-size:clamp(10px,1.45vw,18px);font-weight:800;line-height:1}.calendar-picture::before{content:'ようび';position:absolute;top:5%;left:0;right:0;text-align:center;color:#fff;font-size:18%;font-weight:800}.calendar-day{display:grid;place-items:center;min-width:0;aspect-ratio:1;border-radius:50%}.calendar-day.selected{outline:3px solid #cf2028;outline-offset:1px}.coin-picture{border:13px double #858c94;border-radius:50%;background:radial-gradient(circle,#f8f9fa 45%,#c2c8cf 46% 53%,#f5f6f7 54% 69%,#aeb5bd 70% 73%,#f5f6f7 74%);font-size:28%;font-weight:900;line-height:1.05;text-align:center;letter-spacing:.03em}.coin-picture::before{content:'日本国';position:absolute;top:15%;font-size:18%;font-weight:700}.coin-picture::after{content:'100';position:absolute;bottom:13%;font-size:18%;font-weight:700}.correct-picture{font-size:95%;font-weight:900;color:#cf2028}.score-picture{overflow:hidden;border:5px solid #444;border-radius:8%;background:repeating-linear-gradient(#fff 0 15%,#c7d5e3 16% 17%);display:grid;place-items:center;font-size:33%;font-weight:900;color:#c9212a;transform:rotate(-4deg)}.score-picture::before{content:'テスト';position:absolute;top:9%;left:12%;font-size:22%;color:#222}.score-picture::after{content:'○　○';position:absolute;bottom:8%;right:8%;font-size:28%;letter-spacing:6%;color:#cf2028}.letters-picture{border:5px solid #296a9d;border-radius:12%;background:#fff7df;grid-template-columns:repeat(2,1fr);padding:12%;font-size:38%;font-weight:900;color:#1c4b78;transform:rotate(-3deg)}.letters-picture b{display:grid;place-items:center;border:2px solid #8bb1d1;border-radius:12%;background:#fff}.woods-picture{display:flex;justify-content:center;align-items:end;gap:7%;padding-bottom:8%;background:#dff2ff;border-radius:12%}.tree{position:relative;width:31%;height:72%;background:#8a5a3b;border-radius:35% 35% 8% 8%;margin-top:18%}.tree::before,.tree::after{content:'';position:absolute;border-radius:50%;background:#3f9b45}.tree::before{width:185%;height:65%;left:-42%;top:-29%}.tree::after{width:135%;height:62%;left:-4%;top:-53%}.village-picture{overflow:hidden;border-radius:12%;background:linear-gradient(#a8dcff 0 54%,#78b84b 54%)}.village-picture::before{content:'';position:absolute;width:62%;height:28%;left:8%;bottom:14%;background:#fff;border:4px solid #5d3c2b;border-radius:6%;box-shadow:72px 22px 0 -8px #fff,72px 22px 0 -4px #5d3c2b}.village-picture::after{content:'⌂　⌂';position:absolute;left:10%;bottom:32%;font-size:42%;letter-spacing:3%;color:#d34a38}
#message{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(255,255,255,.97);text-align:center;font-size:clamp(170px,31vw,400px);font-weight:800;opacity:0;pointer-events:none;transition:opacity .12s ease}#message.show{opacity:1}#message.correct{color:#cf2028}#message.retry{color:#1c1c1c;font-size:clamp(40px,7vw,84px)}#done{display:none;position:fixed;inset:0;z-index:20;place-items:center;text-align:center;font-size:clamp(48px,8vw,112px);font-weight:800;line-height:1.45;background:#fff}#done.show{display:grid}
#teacher-trigger{position:fixed;right:0;bottom:0;width:48px;height:48px;z-index:40}#teacher{display:none;position:fixed;inset:0;z-index:50;background:#f6f6f6;overflow-y:auto;-webkit-overflow-scrolling:touch}#teacher.show{display:block}.panel{max-width:1120px;margin:0 auto;background:#fff;border:2px solid #222;border-radius:20px;padding:clamp(22px,4vw,48px)}h1{margin:0 0 24px;font-size:clamp(28px,5vw,48px)}h2{font-size:clamp(22px,4vw,34px);margin:34px 0 14px}p{font-size:clamp(17px,2.6vw,23px);line-height:1.6}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}input{min-width:180px;font-size:28px;padding:12px;border:2px solid #222;border-radius:10px}.teacher-button{border:2px solid #222;border-radius:10px;background:#fff;padding:13px 18px;font-size:20px;cursor:pointer}.primary{background:#1d5db3;color:#fff}.danger{color:#a51c25}.check{display:grid;place-items:center;border:3px solid #222;border-radius:20px;min-height:200px;font-size:clamp(110px,20vw,230px);font-weight:800;margin:14px 0}.notice{padding:14px 18px;border-left:6px solid #1d5db3;background:#eef5ff}.history-item{border:2px solid #333;border-radius:12px;padding:16px;margin:14px 0}.history-item h3{font-size:clamp(20px,3vw,27px);margin:0 0 8px}.records{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}.records li{border:1px solid #555;border-radius:8px;padding:7px 9px;margin:0;font-size:18px;line-height:1.35}.empty{color:#555}.orientation{display:none;position:fixed;inset:0;z-index:60;place-items:center;padding:32px;background:#fff;font-size:clamp(32px,8vw,72px);font-weight:700;text-align:center}@media(orientation:portrait){.orientation{display:grid}}@media(max-height:520px){.choice{min-height:130px}#student{grid-template-rows:minmax(110px,34vh) 1fr;gap:12px}.set{padding:8px;gap:3px}}
</style><style>.reference-picture{display:block;width:clamp(120px,17vw,210px);aspect-ratio:1;object-fit:contain}.correct-picture{font-size:clamp(130px,17vw,210px);line-height:1}#done,#teacher-trigger{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#teacher-trigger{width:72px;height:72px;touch-action:none}</style></head><body>
<main id="home" class="screen"><h1>かんじとえ</h1><div id="sets"></div></main>
<main id="student" class="screen"><div id="kanji" class="kanji" aria-live="polite"></div><div id="choices" class="choices"></div></main>
<section id="done" class="screen" aria-live="polite">できました。<br>先生に伝えてください。</section><div id="message" role="status" aria-live="assertive"></div><div id="teacher-trigger" aria-hidden="true"></div>
<section id="teacher" class="screen"><div class="panel"><h1>教師用画面</h1><div id="pin-area"><p>パスコードを入力してください。</p><div class="row"><input id="pin" type="password" inputmode="numeric" maxlength="4" aria-label="4けたのパスコード"><button id="unlock" class="teacher-button primary" type="button">開く</button></div><p id="pin-error" role="alert"></p></div><div id="teacher-content" hidden><h2>口頭で確認する漢字</h2><p id="set-name"></p><p>生徒に、下の言葉の中の漢字を何と読むか聞いてください。</p><div id="check" class="check"></div><p id="check-target"></p><div class="row"><button id="another" class="teacher-button" type="button">別の漢字を出す</button><button id="home-button" class="teacher-button" type="button">ホーム画面へ戻る</button></div><h2>学習の記録</h2><p class="notice">記録はこのiPadのSafari内にのみ保存されます。SafariのWebサイトデータを消去したり、iPadを初期化・交換したりすると記録は消えます。</p><div id="history"></div><div class="row" style="margin-top:18px"><button id="clear-today" class="teacher-button danger" type="button">今日の記録を消去</button><button id="clear-all" class="teacher-button danger" type="button">すべての記録を消去</button></div></div></div></section>
<div class="orientation">iPadを横向きにしてください。</div>
<script>
(()=>{'use strict';
const PIN='2580',KEY='kanji-matching-history-v2';
const rawSets=[
['セット 1',[['一','一時','いちじ','clock'],['二','二時','にじ','clock'],['三','三時','さんじ','clock'],['四','四時','よじ','clock'],['五','五時','ごじ','clock'],['六','六時','ろくじ','clock'],['七','七時','しちじ','clock'],['八','八時','はちじ','clock'],['九','九時','くじ','clock'],['十','十時','じゅうじ','clock']]],
['セット 2',[['上','上着','うわぎ'],['下','靴下','くつした'],['左','左手','ひだりて'],['右','右手','みぎて'],['中','背中','せなか'],['大','大きい','おおきい'],['小','小さい','ちいさい'],['出','出口','でぐち'],['入','入口','いりぐち'],['立','立つ','たつ']]],
['セット 3',[['山','火山','かざん'],['川','川遊び','かわあそび'],['水','水道','すいどう'],['火','火曜日','かようび','weekday-火'],['木','木曜日','もくようび','weekday-木'],['金','金曜日','きんようび','weekday-金'],['土','土曜日','どようび','weekday-土'],['石','石ころ','いしころ'],['空','空気','くうき'],['雨','雨の日','あめのひ']]],
['セット 4',[['日','日曜日','にちようび','weekday-日'],['月','月曜日','げつようび','weekday-月'],['年','今年','ことし'],['早','早起き','はやおき'],['夕','夕方','ゆうがた'],['天','天気','てんき'],['気','元気','げんき'],['青','青空','あおぞら'],['白','白い','しろい'],['円','百円','ひゃくえん','coin']]],
['セット 5',[['犬','子犬','こいぬ'],['虫','昆虫','こんちゅう'],['貝','貝がら','かいがら'],['花','花火','はなび'],['草','草花','くさばな'],['竹','竹やぶ','たけやぶ'],['森','森林','しんりん'],['糸','毛糸','けいと'],['田','田んぼ','たんぼ'],['林','林','はやし','woods']]],
['セット 6',[['人','大人','おとな'],['子','子ども','こども'],['女','女の子','おんなのこ'],['男','男の子','おとこのこ'],['生','先生','せんせい'],['先','先に','さきに'],['学','学ぶ','まなぶ'],['校','学校','がっこう'],['休','休み時間','やすみじかん'],['名','名前','なまえ']]],
['セット 7',[['口','お口','くち'],['目','目薬','めぐすり'],['耳','耳そうじ','みみそうじ'],['手','手洗い','てあらい'],['足','足あと','あしあと'],['見','見る','みる'],['車','車いす','くるまいす'],['町','町なか','まちなか'],['村','村','むら','village'],['本','教科書','きょうかしょ']]],
['セット 8',[['王','王様','おうさま'],['音','音楽','おんがく'],['玉','玉入れ','たまいれ'],['正','正しい','ただしい','correct-circle'],['赤','赤信号','あかしんごう'],['千','千円','せんえん'],['百','百点','ひゃくてん','score'],['文','文房具','ぶんぼうぐ'],['字','文字','もじ','letters'],['力','力持ち','ちからもち']]]
];
const sets=rawSets.map(([name,words],setIndex)=>({name,words:words.map(([kanji,term,reading,special=''],tile)=>({kanji,term,reading,special,sprite:setIndex+1,tile}))}));const allWords=sets.flatMap(s=>s.words);
const $=s=>document.querySelector(s),home=$('#home'),setBox=$('#sets'),student=$('#student'),kanji=$('#kanji'),choices=$('#choices'),message=$('#message'),done=$('#done'),teacher=$('#teacher'),trigger=$('#teacher-trigger'),pin=$('#pin'),pinArea=$('#pin-area'),teacherContent=$('#teacher-content'),pinError=$('#pin-error'),check=$('#check'),checkTarget=$('#check-target'),setName=$('#set-name'),history=$('#history');
let currentSet=null,queue=[],index=0,results={},completed=[],locked=false,timer=null;
const shuffle=a=>[...a].sort(()=>Math.random()-.5),today=()=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),now=()=>new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date());
function icon(word){let picture;if(word.special==='clock'){const hour=(word.tile+1)%12;picture=`<span class="symbol-picture clock-picture" aria-hidden="true" style="--hour-angle:${hour*30}deg"><i class="clock-hand hour"></i><i class="clock-hand minute"></i><i class="clock-dot"></i><b class="clock-side left">9</b><b class="clock-side right">3</b></span>`}else if(word.special.startsWith('weekday-')){const selected=word.special.slice(-1),days=['月','火','水','木','金','土','日'];picture=`<span class="symbol-picture calendar-picture" aria-hidden="true">${days.map(day=>`<b class="calendar-day${day===selected?' selected':''}">${day}</b>`).join('')}</span>`}else if(word.special==='coin'){picture='<img class="reference-picture" src="assets/illustrations/coin-100yen.png" alt="">'}else if(word.special==='correct-circle'){picture='<span class="symbol-picture correct-picture" aria-hidden="true">○</span>'}else if(word.special==='score'){picture='<img class="reference-picture" src="assets/illustrations/score-100.png" alt="">'}else if(word.special==='letters'){picture='<img class="reference-picture" src="assets/illustrations/letters-a.png" alt="">'}else if(word.special==='woods'){picture='<span class="symbol-picture woods-picture" aria-hidden="true"><i class="tree"></i><i class="tree"></i></span>'}else if(word.special==='village'){picture='<span class="symbol-picture village-picture" aria-hidden="true"></span>'}else{const column=word.tile%5,row=Math.floor(word.tile/5);picture=`<span class="picture" aria-hidden="true" style="--sprite:url('assets/sprites/set-${word.sprite}.png');--position-x:${column*25}%;--position-y:${row*100}%"></span>`}return `${picture}<span class="reading">${word.reading}</span>`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderHome(){setBox.replaceChildren(...sets.map((set,i)=>{const b=document.createElement('button');b.className='set';b.type='button';b.innerHTML=`<span class="set-name">セット ${i+1}</span><span class="set-words">${set.words.map(w=>w.kanji).join('')}</span>`;b.addEventListener('click',()=>start(set));return b}))}
function start(set){currentSet=set;queue=shuffle(set.words);index=0;completed=[];results=Object.fromEntries(set.words.map(w=>[w.kanji,{term:w.term,firstCorrect:null,errors:0}]));home.hidden=true;done.classList.remove('show');student.classList.add('show');showQuestion()}function showHome(){currentSet=null;home.hidden=false;student.classList.remove('show');done.classList.remove('show')}
function showQuestion(){const word=queue[index];kanji.textContent=word.term;const opts=shuffle([word,...shuffle(allWords.filter(x=>x.kanji!==word.kanji)).slice(0,2)]);choices.replaceChildren(...opts.map(option=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-label','このえをえらぶ');b.innerHTML=icon(option);b.addEventListener('click',()=>answer(option.kanji===word.kanji));return b}))}
function flash(text,kind,ms,next){message.textContent=text;message.className=`show ${kind}`;setTimeout(()=>{message.className='';next()},ms)}function answer(ok){if(locked)return;locked=true;const word=queue[index],r=results[word.kanji];if(!ok){if(r.firstCorrect===null)r.firstCorrect=false;r.errors++;flash('もういちど','retry',900,()=>locked=false);return}if(r.firstCorrect===null)r.firstCorrect=true;completed.push(word);flash('○','correct',1000,()=>{index++;locked=false;if(index<queue.length)showQuestion();else finish()})}
function getHistory(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function finish(){const old=getHistory();old.push({date:today(),time:now(),setName:currentSet.name,results});localStorage.setItem(KEY,JSON.stringify(old));student.classList.remove('show');done.classList.add('show')}
function openTeacher(){home.hidden=true;student.classList.remove('show');done.classList.remove('show');teacher.classList.add('show');pinArea.hidden=false;teacherContent.hidden=true;pin.value='';pinError.textContent='';pin.focus()}function unlock(){if(pin.value!==PIN){pinError.textContent='パスコードが違います。';pin.select();return}pinArea.hidden=true;teacherContent.hidden=false;teacherContent.querySelectorAll('h2')[1].textContent='直近の記録とセット別の初回正答率';showCheck();renderHistory()}function showCheck(){const source=completed.length?completed:(currentSet?currentSet.words:[]);const word=source.length?source[Math.floor(Math.random()*source.length)]:null;setName.textContent=currentSet?`${currentSet.name}（${currentSet.words.map(w=>w.kanji).join('')}）`:'ホーム画面からセットを選んでください。';check.textContent=word?word.term:'―';check.classList.toggle('term',Boolean(word&&word.term.length>1));checkTarget.textContent=word?`「${word.kanji}」の読みを聞いてください。`:''}
function renderHistory(){const rows=getHistory(),latest=rows.at(-1);const latestView=latest?`<article class="history-item"><h3>直近の記録　${esc(latest.date)}　${esc(latest.time)}　${esc(latest.setName||'セット名なし')}</h3><ul class="records">${Object.entries(latest.results||{}).map(([k,v])=>`<li><strong>${esc(v.term||k)}（${esc(k)}）：${v.firstCorrect?'○':'×'}</strong><br>誤答 ${Number(v.errors)||0}回</li>`).join('')}</ul></article>`:'<p class="empty">まだ記録はありません。</p>';const summary=`<h3>これまでのセット別 初回正答率</h3><div class="records">${sets.map(set=>{const answers=rows.filter(r=>r.setName===set.name).flatMap(r=>Object.values(r.results||{}));const correct=answers.filter(v=>v.firstCorrect===true).length;const rate=answers.length?Math.round(correct/answers.length*100):null;return `<article class="history-item"><h3>${esc(set.name)}</h3><p><strong>${rate===null?'まだ記録はありません':`初回正答率　${rate}%`}</strong>${answers.length?`<br>${answers.length/10}回取り組みました`:''}</p></article>`}).join('')}</div>`;history.innerHTML=latestView+summary}
function clear(mode){if(!confirm(mode==='today'?'今日の記録を消去しますか？':'すべての記録を消去しますか？'))return;localStorage.setItem(KEY,JSON.stringify(mode==='today'?getHistory().filter(r=>r.date!==today()):[]));renderHistory()}function hold(e){e.preventDefault();clearTimeout(timer);timer=setTimeout(openTeacher,900)}function cancel(){clearTimeout(timer)}
trigger.addEventListener('pointerdown',hold,{passive:false});['pointerup','pointercancel','pointerleave'].forEach(e=>trigger.addEventListener(e,cancel));trigger.addEventListener('touchstart',hold,{passive:false});['touchend','touchcancel'].forEach(e=>trigger.addEventListener(e,cancel));trigger.addEventListener('contextmenu',e=>e.preventDefault());$('#unlock').addEventListener('click',unlock);pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('#another').addEventListener('click',showCheck);$('#home-button').addEventListener('click',()=>{teacher.classList.remove('show');showHome()});$('#clear-today').addEventListener('click',()=>clear('today'));$('#clear-all').addEventListener('click',()=>clear('all'));renderHome();
})();
</script></body></html>
