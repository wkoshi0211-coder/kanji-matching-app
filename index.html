<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>かんじとえ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#151515;background:#fff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-width:320px;min-height:100vh;min-height:100dvh;overflow:hidden;background:#fff}[hidden]{display:none!important}button,input{font:inherit}.screen{min-height:100vh;min-height:100dvh;padding:max(24px,env(safe-area-inset-top)) max(32px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left))}
#home{display:grid;grid-template-rows:auto 1fr;gap:clamp(16px,3vh,30px)}#home h1{margin:0;text-align:center;font-size:clamp(34px,6vw,64px)}#sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px)}.set{border:4px solid #171717;border-radius:22px;background:#fff;padding:16px 12px;cursor:pointer;display:grid;align-content:center;gap:10px;color:#171717}.set:active,.choice:active{background:#f2f2f2;transform:scale(.98)}.set:focus-visible,.choice:focus-visible{outline:6px solid #1259b6;outline-offset:5px}.set-name{font-size:clamp(25px,3.3vw,42px);font-weight:800}.set-words{font-size:clamp(20px,2.7vw,34px);letter-spacing:.12em;line-height:1.4}
#student{display:none;grid-template-rows:minmax(150px,36vh) 1fr;gap:clamp(18px,4vh,42px)}#student.show{display:grid}.kanji{display:grid;place-items:center;border:4px solid #171717;border-radius:28px;font-size:clamp(112px,22vw,250px);font-weight:700;line-height:1}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,36px)}.choice{border:4px solid #171717;border-radius:24px;background:#fff;min-height:220px;display:grid;place-items:center;padding:14px;cursor:pointer}.picture{font-size:clamp(76px,13vw,156px);line-height:1;text-align:center}.dots{font-size:clamp(42px,6vw,70px);line-height:1.2;letter-spacing:.08em;color:#e65d43}
#message{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(255,255,255,.97);text-align:center;font-size:clamp(170px,31vw,400px);font-weight:800;opacity:0;pointer-events:none;transition:opacity .12s ease}#message.show{opacity:1}#message.correct{color:#cf2028}#message.retry{color:#1c1c1c;font-size:clamp(40px,7vw,84px)}#done{display:none;position:fixed;inset:0;z-index:20;place-items:center;text-align:center;font-size:clamp(48px,8vw,112px);font-weight:800;line-height:1.45;background:#fff}#done.show{display:grid}
#teacher-trigger{position:fixed;right:0;bottom:0;width:48px;height:48px;z-index:40}#teacher{display:none;position:fixed;inset:0;z-index:50;background:#f6f6f6;overflow-y:auto;-webkit-overflow-scrolling:touch}#teacher.show{display:block}.panel{max-width:1120px;margin:0 auto;background:#fff;border:2px solid #222;border-radius:20px;padding:clamp(22px,4vw,48px)}h1{margin:0 0 24px;font-size:clamp(28px,5vw,48px)}h2{font-size:clamp(22px,4vw,34px);margin:34px 0 14px}p{font-size:clamp(17px,2.6vw,23px);line-height:1.6}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}input{min-width:180px;font-size:28px;padding:12px;border:2px solid #222;border-radius:10px}.teacher-button{border:2px solid #222;border-radius:10px;background:#fff;padding:13px 18px;font-size:20px;cursor:pointer}.primary{background:#1d5db3;color:#fff}.danger{color:#a51c25}.check{display:grid;place-items:center;border:3px solid #222;border-radius:20px;min-height:200px;font-size:clamp(110px,20vw,230px);font-weight:800;margin:14px 0}.notice{padding:14px 18px;border-left:6px solid #1d5db3;background:#eef5ff}.history-item{border:2px solid #333;border-radius:12px;padding:16px;margin:14px 0}.history-item h3{font-size:clamp(20px,3vw,27px);margin:0 0 8px}.records{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}.records li{border:1px solid #555;border-radius:8px;padding:7px 9px;margin:0;font-size:18px;line-height:1.35}.empty{color:#555}.orientation{display:none;position:fixed;inset:0;z-index:60;place-items:center;padding:32px;background:#fff;font-size:clamp(32px,8vw,72px);font-weight:700;text-align:center}@media(orientation:portrait){.orientation{display:grid}}@media(max-height:520px){.choice{min-height:130px}#student{grid-template-rows:minmax(110px,34vh) 1fr;gap:12px}.set{padding:8px;gap:3px}}
</style></head><body>
<main id="home" class="screen"><h1>かんじとえ</h1><div id="sets"></div></main>
<main id="student" class="screen"><div id="kanji" class="kanji" aria-live="polite"></div><div id="choices" class="choices"></div></main>
<section id="done" class="screen" aria-live="polite">できました。<br>先生をよんでください。</section><div id="message" role="status" aria-live="assertive"></div><div id="teacher-trigger" aria-hidden="true"></div>
<section id="teacher" class="screen"><div class="panel"><h1>教師用画面</h1><div id="pin-area"><p>パスコードを入力してください。</p><div class="row"><input id="pin" type="password" inputmode="numeric" maxlength="4" aria-label="4けたのパスコード"><button id="unlock" class="teacher-button primary" type="button">開く</button></div><p id="pin-error" role="alert"></p></div><div id="teacher-content" hidden><h2>口頭で確認する漢字</h2><p id="set-name"></p><p>生徒に「この漢字は何て読みますか」と聞いてください。</p><div id="check" class="check"></div><div class="row"><button id="another" class="teacher-button" type="button">別の漢字を出す</button><button id="home-button" class="teacher-button" type="button">ホーム画面へ戻る</button></div><h2>学習の記録</h2><p class="notice">記録はこのiPadのSafari内にのみ保存されます。SafariのWebサイトデータを消去したり、iPadを初期化・交換したりすると記録は消えます。</p><div id="history"></div><div class="row" style="margin-top:18px"><button id="clear-today" class="teacher-button danger" type="button">今日の記録を消去</button><button id="clear-all" class="teacher-button danger" type="button">すべての記録を消去</button></div></div></div></section>
<div class="orientation">iPadを横向きにしてください。</div>
<script>
(()=>{'use strict';
const PIN='2580',KEY='kanji-matching-history-v2';
const rawSets=[
['セット 1','一 二 三 四 五 六 七 八 九 十','●|●●|●●●|●●●●|●●●●●|●●●●●●|●●●●●●●|●●●●●●●●|●●●●●●●●●|●●●●●●●●●●'],
['セット 2','上 下 左 右 中 大 小 出 入 立','⬆️|⬇️|⬅️|➡️|🎯|🟠|🔹|↗️|↘️|🧍'],
['セット 3','山 川 水 火 木 金 土 石 空 雨','🏔️|🌊|💧|🔥|🌳|🥇|🟤|🪨|☁️|🌧️'],
['セット 4','日 月 年 早 夕 天 気 青 白 円','☀️|🌙|📅|🌅|🌇|☁️|💨|🔵|⚪|🪙'],
['セット 5','犬 虫 貝 花 草 竹 森 糸 田 林','🐶|🐛|🐚|🌸|🌱|🎋|🌲|🧵|🌾|🌳'],
['セット 6','人 子 女 男 生 先 学 校 休 名','🧍|🧒|👩|👨|🌱|➡️|📖|🏫|🛌|🏷️'],
['セット 7','口 目 耳 手 足 見 車 町 村 本','👄|👁️|👂|✋|🦶|👀|🚗|🏘️|🏡|📖'],
['セット 8','王 音 玉 正 赤 千 百 文 字 力','👑|🔊|🔴|✅|🔴|🔢|🔵|✍️|📄|⚡']
];
const sets=rawSets.map(([name,chars,pics])=>({name,words:chars.split(' ').map((kanji,i)=>({kanji,picture:pics.split('|')[i]}))}));const allWords=sets.flatMap(s=>s.words);
const $=s=>document.querySelector(s),home=$('#home'),setBox=$('#sets'),student=$('#student'),kanji=$('#kanji'),choices=$('#choices'),message=$('#message'),done=$('#done'),teacher=$('#teacher'),trigger=$('#teacher-trigger'),pin=$('#pin'),pinArea=$('#pin-area'),teacherContent=$('#teacher-content'),pinError=$('#pin-error'),check=$('#check'),setName=$('#set-name'),history=$('#history');
let currentSet=null,queue=[],index=0,results={},completed=[],locked=false,timer=null;
const shuffle=a=>[...a].sort(()=>Math.random()-.5),today=()=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),now=()=>new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date());
function icon(word){return word.picture.startsWith('●')?`<span class="dots">${word.picture}</span>`:`<span class="picture" aria-hidden="true">${word.picture}</span>`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderHome(){setBox.replaceChildren(...sets.map((set,i)=>{const b=document.createElement('button');b.className='set';b.type='button';b.innerHTML=`<span class="set-name">セット ${i+1}</span><span class="set-words">${set.words.map(w=>w.kanji).join('')}</span>`;b.addEventListener('click',()=>start(set));return b}))}
function start(set){currentSet=set;queue=shuffle(set.words);index=0;completed=[];results=Object.fromEntries(set.words.map(w=>[w.kanji,{firstCorrect:null,errors:0}]));home.hidden=true;done.classList.remove('show');student.classList.add('show');showQuestion()}function showHome(){currentSet=null;home.hidden=false;student.classList.remove('show');done.classList.remove('show')}
function showQuestion(){const word=queue[index];kanji.textContent=word.kanji;const opts=shuffle([word,...shuffle(allWords.filter(x=>x.kanji!==word.kanji)).slice(0,2)]);choices.replaceChildren(...opts.map(option=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-label','このえをえらぶ');b.innerHTML=icon(option);b.addEventListener('click',()=>answer(option.kanji===word.kanji));return b}))}
function flash(text,kind,ms,next){message.textContent=text;message.className=`show ${kind}`;setTimeout(()=>{message.className='';next()},ms)}function answer(ok){if(locked)return;locked=true;const word=queue[index],r=results[word.kanji];if(!ok){if(r.firstCorrect===null)r.firstCorrect=false;r.errors++;flash('もういちど','retry',900,()=>locked=false);return}if(r.firstCorrect===null)r.firstCorrect=true;completed.push(word.kanji);flash('○','correct',1000,()=>{index++;locked=false;if(index<queue.length)showQuestion();else finish()})}
function getHistory(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function finish(){const old=getHistory();old.push({date:today(),time:now(),setName:currentSet.name,results});localStorage.setItem(KEY,JSON.stringify(old));student.classList.remove('show');done.classList.add('show')}
function openTeacher(){home.hidden=true;student.classList.remove('show');done.classList.remove('show');teacher.classList.add('show');pinArea.hidden=false;teacherContent.hidden=true;pin.value='';pinError.textContent='';pin.focus()}function unlock(){if(pin.value!==PIN){pinError.textContent='パスコードが違います。';pin.select();return}pinArea.hidden=true;teacherContent.hidden=false;showCheck();renderHistory()}function showCheck(){const source=completed.length?completed:(currentSet?currentSet.words.map(w=>w.kanji):[]);setName.textContent=currentSet?`${currentSet.name}（${currentSet.words.map(w=>w.kanji).join('')}）`:'ホーム画面からセットを選んでください。';check.textContent=source.length?source[Math.floor(Math.random()*source.length)]:'―'}
function renderHistory(){const rows=getHistory().slice().reverse();if(!rows.length){history.innerHTML='<p class="empty">まだ記録はありません。</p>';return}history.innerHTML=rows.map(r=>`<article class="history-item"><h3>${esc(r.date)}　${esc(r.time)}　${esc(r.setName||'セット名なし')}</h3><ul class="records">${Object.entries(r.results||{}).map(([k,v])=>`<li><strong>${esc(k)}：${v.firstCorrect?'○':'×'}</strong><br>誤答 ${Number(v.errors)||0}回</li>`).join('')}</ul></article>`).join('')}
function clear(mode){if(!confirm(mode==='today'?'今日の記録を消去しますか？':'すべての記録を消去しますか？'))return;localStorage.setItem(KEY,JSON.stringify(mode==='today'?getHistory().filter(r=>r.date!==today()):[]));renderHistory()}function hold(e){e.preventDefault();timer=setTimeout(openTeacher,900)}function cancel(){clearTimeout(timer)}
trigger.addEventListener('pointerdown',hold);['pointerup','pointercancel','pointerleave'].forEach(e=>trigger.addEventListener(e,cancel));$('#unlock').addEventListener('click',unlock);pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('#another').addEventListener('click',showCheck);$('#home-button').addEventListener('click',()=>{teacher.classList.remove('show');showHome()});$('#clear-today').addEventListener('click',()=>clear('today'));$('#clear-all').addEventListener('click',()=>clear('all'));renderHome();
})();
</script></body></html>
